<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="1" stop-color="#140b2e"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
<animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<g stroke="#38bdf8" stroke-opacity=".08">
<path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M100 0V300M250 0V300M400 0V300M550 0V300M700 0V300M850 0V300M1000 0V300M1150 0V300"/></g>
<g transform="translate(980 150)">
<g fill="none" stroke="#38bdf8" stroke-width="2">
<rect x="-70" y="-70" width="140" height="140" rx="6" stroke-opacity=".8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></rect>
<rect x="-48" y="-48" width="96" height="96" rx="4" stroke="#a78bfa"><animateTransform attributeName="transform" type="rotate" from="45" to="-315" dur="10s" repeatCount="indefinite"/></rect>
<circle r="95" stroke-opacity=".25" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle>
</g>
<circle r="30" fill="url(#core)"><animate attributeName="r" values="24;34;24" dur="2.4s" repeatCount="indefinite"/></circle>
</g>
<text x="70" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="82" font-weight="800" fill="url(#tx)">Sealvix</text>
<text x="74" y="190" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#cbd5e1">Broken code goes in sealed. A verified fix comes out.</text>
<g font-family="monospace" font-size="16">
<text x="74" y="240" fill="#f87171">FAIL exit 1<animate attributeName="opacity" values="1;0;0;1" dur="4s" repeatCount="indefinite"/></text>
<text x="74" y="240" fill="#4ade80" opacity="0">PASS exit 0 · sha256 receipt<animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/></text>
</g>
</svg>
